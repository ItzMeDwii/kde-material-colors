; kde-material-you-colors configuration - example for this hook.
;
; Copy the lines you need into ~/.config/kde-material-you-colors/config.conf
; (KMYC rewrites that file itself, preserving unknown keys it does not manage).
; The only line strictly required is on_change_hook.

[CUSTOM]

; --- hook wiring -----------------------------------------------------------
on_change_hook=$HOME/.config/kde-material-you-colors/hook/apply.py
main_loop_delay=1

; --- scheme the hook renders from ------------------------------------------
light=true
scheme_variant=5
contrast_level=0

; --- palette shaping -------------------------------------------------------
chroma_multiplier=1
tone_multiplier=1
dark_brightness_multiplier=1
dark_saturation_multiplier=1
light_brightness_multiplier=1
light_saturation_multiplier=1

; --- pywal bridge (firefox target reads ~/.cache/wal/colors.json) ----------
pywal=true
pywal_follows_scheme=true
pywal_light=true

; --- let Plasma follow the generated scheme -------------------------------
plasma_follows_scheme=true

; --- icon themes -----------------------------------------------------------
iconsdark=Papirus
iconslight=Papirus

; --- transparency (0-100, kde-material-you-colors only) --------------------
konsole_opacity=100
konsole_opacity_dark=100
titlebar_opacity=100
titlebar_opacity_dark=100
toolbar_opacity=100
toolbar_opacity_dark=100
